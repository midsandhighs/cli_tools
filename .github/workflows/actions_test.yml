# Basic OS Test
#
# Lints the shell scripts with shellcheck and runs the smoke script on
# both macOS and Ubuntu so the cross-platform claims stay honest.

name: Basic OS Test

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events and maybe has a button?
  pull_request:
  workflow_dispatch:

jobs:
  # Lint every standalone shell script. shellcheck ships on the Ubuntu runner.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        # --severity=warning catches real problems (bashisms in #!/bin/sh
        # scripts, unguarded cd, etc.) without failing on stylistic nits.
        run: |
          shellcheck --version
          find scripts -type f \( -name '*.sh' -o -name cli-setup \) -print0 \
            | xargs -0 shellcheck --severity=warning

  # Smoke test on each supported OS.
  smoke:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a set of commands to report some info
      - name: debug info
        run: |
          whoami
          echo "$PATH"
          echo "$SHELL"
          echo "$PWD"
          ls -la

      - name: script run
        run: bash scripts/devops/tests/actions_test.sh
